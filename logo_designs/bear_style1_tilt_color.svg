<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2538"/>
      <stop offset="100%" stop-color="#101420"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#57CC99"/>
      <stop offset="100%" stop-color="#7AE582"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Music Sparkle -->
  <path d="M 430,92 Q 445,92 445,66 Q 445,92 460,92 Q 445,92 445,118 Q 445,92 430,92 Z" fill="#7AE582"/>

  <!-- 12-degree chill tilt group -->
  <g transform="rotate(12 256 280)">
    <!-- Headphone Arch Band -->
    <path d="M 108,276 C 108,98 404,98 404,276" fill="none" stroke="url(#bandGrad)" stroke-width="32" stroke-linecap="round"/>

    <!-- Left Ear -->
    <circle cx="168" cy="184" r="42" fill="#C69A68"/>
    <circle cx="168" cy="184" r="23" fill="#9E7445"/>

    <!-- Right Ear -->
    <circle cx="344" cy="184" r="42" fill="#C69A68"/>
    <circle cx="344" cy="184" r="23" fill="#9E7445"/>

    <!-- Head Base -->
    <rect x="133" y="184" width="246" height="236" rx="112" fill="#C69A68"/>

    <!-- Snout Base -->
    <rect x="174" y="276" width="164" height="118" rx="60" fill="#E4C39E"/>

    <!-- Cute Nose -->
    <circle cx="256" cy="312" r="20" fill="#3B2613"/>

    <!-- Closed Chill Smiling Eyes (◠ ‿ ◠) -->
    <path d="M 174,261 Q 200,235 225,261" fill="none" stroke="#3B2613" stroke-width="12" stroke-linecap="round"/>
    <path d="M 287,261 Q 312,235 338,261" fill="none" stroke="#3B2613" stroke-width="12" stroke-linecap="round"/>

    <!-- Rosy Blush Cheeks -->
    <circle cx="158" cy="297" r="24" fill="#FF8577" opacity="0.5"/>
    <circle cx="354" cy="297" r="24" fill="#FF8577" opacity="0.5"/>

    <!-- Left Ear Cushion -->
    <rect x="87" y="230" width="52" height="112" rx="26" fill="#38A374"/>

    <!-- Right Ear Cushion -->
    <rect x="373" y="230" width="52" height="112" rx="26" fill="#38A374"/>
  </g>
</svg>
