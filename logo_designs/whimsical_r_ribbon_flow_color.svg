<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1426" />
      <stop offset="100%" stop-color="#04070F" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="20%" y1="20%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ribbonBg)" />

  <!-- Acoustic frequency ring arc -->
  <path d="M 360 102 A 150 150 0 0 1 430 210" fill="none" stroke="#818CF8" stroke-width="10" stroke-linecap="round" opacity="0.5" />

  <!-- Main Ribbon Loop -->
  <path d="M 164 420 L 164 164 C 164 77, 379 77, 379 195 C 379 287, 246 287, 174 276"
        fill="none" stroke="url(#ribbonGrad)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Crossover negative-space cut circle -->
  <circle cx="225" cy="266" r="38" fill="#060B16" />

  <!-- Leg Wave Ribbon -->
  <path d="M 225 266 C 287 297, 338 348, 399 410 C 420 430, 440 430, 451 410"
        fill="none" stroke="url(#ribbonGrad)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
</svg>
