<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140D24"/>
      <stop offset="100%" stop-color="#090610"/>
    </linearGradient>
    <linearGradient id="rStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B388FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="rLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#rBg)"/>

  <!-- Vertical Sound Stem of the "R" -->
  <rect x="128" y="102" width="62" height="308" rx="31" fill="url(#rStem)"/>

  <!-- Upper Resonant Loop Arc -->
  <path d="M 158,133 A 87,87 0 0,1 158,307" fill="none" stroke="url(#rStem)" stroke-width="56" stroke-linecap="round"/>

  <!-- Dynamic Forward Pulse Leg -->
  <line x1="225" y1="266" x2="368" y2="410" stroke="url(#rLeg)" stroke-width="56" stroke-linecap="round"/>

  <!-- Concentric Sound Propagation Arc -->
  <path d="M 394,158 A 118,118 0 0,1 394,354" fill="none" stroke="#00E5FF" stroke-width="24" stroke-linecap="round" opacity="0.75"/>
</svg>
