<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Monochrome SVG for Android 13+ Themed Icons and Android 12+ Status Bar Notifications -->
  <!-- Headphone Arch Band -->
  <path d="M 102,225 C 102,61 410,61 410,225" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>

  <!-- Shiba Pointy Ears -->
  <polygon points="133,164 112,77 194,133" fill="#FFFFFF"/>
  <polygon points="379,164 400,77 318,133" fill="#FFFFFF"/>

  <!-- Main Head -->
  <circle cx="256" cy="225" r="128" fill="#FFFFFF"/>

  <!-- Cutout Face Mask -->
  <path d="M 154,230 C 164,184 230,205 256,215 C 282,205 348,184 358,230 C 369,307 307,348 256,348 C 205,348 143,307 154,230 Z" fill="#000000"/>

  <!-- Eyes in Cutout -->
  <path d="M 184,220 Q 205,194 225,220" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M 287,220 Q 307,194 328,220" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Nose -->
  <circle cx="256" cy="256" r="18" fill="#FFFFFF"/>

  <!-- Mouth -->
