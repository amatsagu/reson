  <!-- Headphone Ear Cushions with negative space outline -->
  <rect x="77" y="174" width="62" height="112" rx="31" fill="#000000"/>
  <rect x="82" y="179" width="52" height="102" rx="26" fill="#FFFFFF"/>
  <rect x="374" y="174" width="62" height="112" rx="31" fill="#000000"/>
  <rect x="379" y="179" width="52" height="102" rx="26" fill="#FFFFFF"/>

  <!-- Coconut Silhouette with Umbrella -->
  <circle cx="384" cy="399" r="87" fill="#000000"/>
  <circle cx="384" cy="399" r="77" fill="#FFFFFF"/>
  <circle cx="384" cy="399" r="46" fill="#000000"/>
  <polygon points="389,338 450,307 430,369" fill="#FFFFFF"/>
</svg>
