<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="summerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F3044"/>
      <stop offset="100%" stop-color="#091823"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38D39F"/>
      <stop offset="100%" stop-color="#4EE1A0"/>
    </linearGradient>
  </defs>

  <!-- Background App Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#summerBg)"/>

  <!-- Headphone Arch Band -->
  <path d="M 112,225 C 112,61 400,61 400,225" fill="none" stroke="url(#mintGrad)" stroke-width="28" stroke-linecap="round"/>

  <!-- Floppy Pup Ears -->
  <path d="M 143,133 C 72,133 82,266 133,256 Z" fill="#CE7F26"/>
  <path d="M 369,133 C 440,133 430,266 379,256 Z" fill="#CE7F26"/>

  <!-- Main Head -->
  <circle cx="256" cy="235" r="128" fill="#E89A3C"/>

  <!-- Light Snout / Muzzle -->
  <ellipse cx="256" cy="276" rx="77" ry="66" fill="#FFC078"/>

  <!-- Cute Nose -->
  <circle cx="256" cy="266" r="20" fill="#2C1810"/>

  <!-- Joyful Smile & Tongue -->
  <path d="M 220,297 Q 256,348 292,297 Z" fill="#2C1810"/>
  <path d="M 235,317 Q 256,358 276,317 Z" fill="#FF758F"/>

  <!-- Cool Sunglasses (Wayfarer frame) -->
  <rect x="138" y="179" width="102" height="72" rx="20" fill="#1E293B"/>
  <rect x="271" y="179" width="102" height="72" rx="20" fill="#1E293B"/>
  <rect x="230" y="194" width="52" height="20" rx="10" fill="#1E293B"/>

  <!-- Sunglasses Highlights (Glint) -->
  <line x1="153" y1="230" x2="184" y2="189" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
  <line x1="287" y1="230" x2="317" y2="189" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.8"/>

  <!-- Headphone Ear Cushions -->
  <rect x="87" y="184" width="52" height="102" rx="26" fill="#38D39F"/>
  <rect x="373" y="184" width="52" height="102" rx="26" fill="#38D39F"/>

  <!-- Summer Iced Smoothie Drink (Bottom Right) -->
  <line x1="410" y1="317" x2="384" y2="348" stroke="#FFD166" stroke-width="18" stroke-linecap="round"/>
  <line x1="384" y1="348" x2="384" y2="435" stroke="#FFD166" stroke-width="18" stroke-linecap="round"/>
  <!-- Cup -->
  <polygon points="343,358 435,358 420,481 358,481" fill="#FF6B6B"/>
  <!-- Lid -->
  <rect x="333" y="348" width="112" height="26" rx="10" fill="#E2E8F0"/>
  <!-- Lemon Slice on Rim -->
  <circle cx="348" cy="353" r="28" fill="#FFEE58"/>
  <circle cx="348" cy="353" r="18" fill="#FFF9C4"/>
</svg>
