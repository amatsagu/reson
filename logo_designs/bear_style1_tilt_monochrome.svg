<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Standalone monochrome SVG with clean negative space cutouts for Android Notification & Material You Theme -->
  <g transform="rotate(12 256 280)">
    <!-- Headphone Arch -->
    <path d="M 108,276 C 108,98 404,98 404,276" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>

    <!-- Left Ear with negative cutout -->
    <circle cx="168" cy="184" r="42" fill="#FFFFFF"/>
    <circle cx="168" cy="184" r="23" fill="#000000"/>

    <!-- Right Ear with negative cutout -->
    <circle cx="344" cy="184" r="42" fill="#FFFFFF"/>
    <circle cx="344" cy="184" r="23" fill="#000000"/>

    <!-- Head Base -->
    <rect x="133" y="184" width="246" height="236" rx="112" fill="#FFFFFF"/>

    <!-- Snout negative cutout -->
    <rect x="184" y="286" width="144" height="92" rx="46" fill="#000000"/>

    <!-- Cute Nose inside cutout -->
    <circle cx="256" cy="312" r="20" fill="#FFFFFF"/>

    <!-- Eyes (cutout slits) -->
    <path d="M 174,261 Q 200,235 225,261" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    <path d="M 287,261 Q 312,235 338,261" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Ear Cushion separation cutout & pad -->
    <rect x="77" y="220" width="62" height="122" rx="31" fill="#000000"/>
    <rect x="87" y="230" width="52" height="112" rx="26" fill="#FFFFFF"/>

    <!-- Right Ear Cushion separation cutout & pad -->
    <rect x="363" y="220" width="62" height="122" rx="31" fill="#000000"/>
    <rect x="373" y="230" width="52" height="112" rx="26" fill="#FFFFFF"/>
  </g>
</svg>
